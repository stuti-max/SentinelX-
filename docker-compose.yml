
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinelx-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      PORT: "5000"
      REDIS_URL: redis://redis:6379
    expose:
      - "5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sentinelx-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sentinelx-net
    restart: unless-stopped

networks:
  sentinelx-net:
    driver: bridge

volumes:
  redis-data:
