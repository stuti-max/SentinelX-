name: Build and Push SentinelX Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SentinelX source
        run: |
          mkdir -p source
          unzip -q SentinelX-Upload.zip -d source
          test -f source/frontend/Dockerfile
          test -f source/backend/Dockerfile

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./source/frontend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/sentinelx-frontend:v1

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./source/backend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/sentinelx-backend:v1
