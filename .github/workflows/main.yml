name: Build and Push SentinelX Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

         - name: Extract SentinelX source
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          with zipfile.ZipFile("SentinelX-Upload.zip") as archive:
              entries = [
                  (info, info.filename.replace("\\", "/"))
                  for info in archive.infolist()
              ]

              prefix = ""
              for info, name in entries:
                  if name.endswith("frontend/Dockerfile"):
                      prefix = name[:-len("frontend/Dockerfile")]
                      break

              root = Path("source")

              for info, name in entries:
                  if prefix and name.startswith(prefix):
                      name = name[len(prefix):]

                  while name.startswith("./"):
                      name = name[2:]

                  path = PurePosixPath(name)
                  if not path.parts or path.is_absolute() or ".." in path.parts:
                      continue

                  target = root.joinpath(*path.parts)

                  if info.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(info) as src, target.open("wb") as dst:
                          dst.write(src.read())

          assert Path("source/frontend/Dockerfile").is_file(), "Frontend Dockerfile not found"
          assert Path("source/backend/Dockerfile").is_file(), "Backend Dockerfile not found"
          print("SentinelX source extracted successfully.")
          PY

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./source/frontend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/sentinelx-frontend:v1

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./source/backend
          push: true
          tags: ${{ secrets.ACR_NAME }}.azurecr.io/sentinelx-backend:v1
